services:
  backend:
    build: ./Backend
    ports:
      - "2000:2000"
    networks:
      - mern_network
    env_file:
      - ./Backend/config/config.env
    depends_on:
      - mongodb

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    networks:
      - mern_network
    env_file:
      - ./Frontend/.env

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - mern_network
    volumes:
      - mongo-data:/data/db

networks:
    mern_network:
      driver: bridge

volumes:
    mongo-data:
      driver: local
